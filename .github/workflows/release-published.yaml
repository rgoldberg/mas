#
# .github/workflows/release-published.yaml
#
---
name: release-published
on:
  release:
    types: [published]
permissions: {}
defaults:
  run:
    # Force all run commands to not use Rosetta 2
    shell: arch -arm64 /bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}
jobs:
  release-published:
    if: ${{!github.event.repository.fork}}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
    - name: 🛒 Checkout repo
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: init.defaultBranch
        GIT_CONFIG_VALUE_0: ${{github.event.repository.default_branch}}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Include all history & tags for Scripts/version
        fetch-depth: 0

    - name: 🔧 Setup repo
      run: Scripts/setup-workflow-repo

    - name: 🚰 Apply pr-pull label to tap formula bump PR
      env:
        TOKEN_APP_ID: ${{secrets.TOKEN_APP_ID}}
        TOKEN_APP_INSTALLATION_ID: ${{secrets.TOKEN_APP_INSTALLATION_ID}}
        TOKEN_APP_PRIVATE_KEY: ${{secrets.TOKEN_APP_PRIVATE_KEY}}
      run: |
        GH_TOKEN="$(Scripts/generate-token)"
        export -r GH_TOKEN
        unsetopt err_exit
        bump_url="$(gh release -R "${GITHUB_REPOSITORY}" download "${GITHUB_REF_NAME}" -p bump.url -O - 2>/dev/null)"
        found_bump_url="${?}"
        setopt err_exit
        if [[ "${found_bump_url}" -ne 0 || -z "${bump_url}" ]]; then
          printf $'::error::Failed to find tap formula bump PR URL for tag %s\n' "${GITHUB_REF_NAME}" >&2
          exit 1
        fi
        gh pr edit "${bump_url}" --add-label pr-pull
        gh release -R "${GITHUB_REPOSITORY}" delete-asset "${GITHUB_REF_NAME}" bump.url -y
