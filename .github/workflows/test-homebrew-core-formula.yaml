#
# .github/workflows/test-homebrew-core-formula.yaml
#
---
name: Test Homebrew Core Formula
on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA
        required: true
        type: string
      version:
        description: Version
        required: true
        type: string
      formula:
        description: Formula
        required: false
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA
        required: true
        type: string
      version:
        description: Version
        required: true
        type: string
      formula:
        description: Formula
        required: false
        type: string
concurrency:
  group: ${{github.workflow}}-${{github.ref}}-${{inputs.version}}
  cancel-in-progress: true
permissions: {}
jobs:
  test-formula:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
      fail-fast: false
    runs-on: ${{matrix.runner}}
    defaults:
      run:
        # Force all run commands to not use Rosetta 2 on arm64
        shell: >-
          ${{
            endsWith(matrix.runner, '-intel')
            && '/bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}'
            || 'arch -arm64 /bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}'
          }}
    steps:
    - name: 🛒 Checkout repo
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: init.defaultBranch
        GIT_CONFIG_VALUE_0: ${{github.event.repository.default_branch}}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{inputs.commit_sha}}
        # Include all history & tags for Scripts/version
        fetch-depth: 0

    - name: 🔧 Setup repo
      run: Scripts/setup-workflow-repo

    - name: 🛠 Select latest stable Xcode
      run: |
        setopt glob_assign
        readonly xcode_path=/Applications/Xcode_[0-9.]##.app(/On[1])
        sudo xcode-select -s "${xcode_path}"
        printf $'DEVELOPER_DIR=%s/Contents/Developer\n' "${xcode_path}" >>"${GITHUB_ENV}"

    - name: 👢 Bootstrap
      run: |
        brew untap -fq aws/tap 2>/dev/null || true
        Scripts/bootstrap

    - name: 🕊 Use Swiftly Swift
      if: ${{!startsWith(matrix.runner, 'macos-26')}}
      run: |
        swiftly init -ny
        git reset --hard HEAD
        swiftly link latest
        printf %s ~/.swiftly/bin >>"${GITHUB_PATH}"

    - name: 🧪 Test formula bump locally
      env:
        COMMIT_SHA: ${{inputs.commit_sha || github.sha}}
        FORMULA: ${{inputs.formula}}
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_GITHUB_API: 1
        HOMEBREW_NO_INSTALL_FROM_API: 1
        VERSION: ${{inputs.version || '999.0.0'}}
      run: |
        git tag "v${VERSION}" "${COMMIT_SHA}"
        if [[ -n "${FORMULA}" ]]; then
          printf %s "${FORMULA}" >"$(brew --repo homebrew/core)/Formula/m/mas.rb"
        else
          sed -E\
            -e "s|^(  url )\"[^\"]+\",|\1\"file://${PWD}\",\\n      using:    :git,|"\
            -e "s|^(      tag: +)\"[^\"]+\"|\1\"v${VERSION}\"|"\
            -e "s|^(      revision: +)\"[^\"]+\"|\1\"${COMMIT_SHA}\"|"\
            -i '' "$(brew edit --print-path mas)"
        fi
        brew install --build-from-source --formula mas
        brew test mas
        brew audit --git --online --strict --formula mas
