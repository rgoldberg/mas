#
# .github/workflows/codeql.yaml
#
---
name: CodeQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
  - cron: 44 14 * * 4
  workflow_dispatch: {}
permissions: {}
defaults:
  run:
    shell: /bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}
jobs:
  analyze:
    name: Analyze ${{matrix.language}}
    runs-on: xcode-27
    permissions:
      security-events: write
    strategy:
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: swift
          build-mode: manual
          queries: +security-and-quality
      fail-fast: false
    steps:
    - name: 🛒 Checkout repo
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: init.defaultBranch
        GIT_CONFIG_VALUE_0: ${{github.event.repository.default_branch}}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Include all history & tags for Scripts/version
        fetch-depth: 0

    - name: 🔧 Setup repo
      run: Scripts/setup-workflow-repo

    - name: 🔩 Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{matrix.language}}
        build-mode: ${{matrix.build-mode}}
        queries: ${{matrix.queries}}

    - name: 🏗 Build Swift
      if: matrix.language == 'swift'
      run: |
        setopt glob_assign
        readonly xcode_path=/Applications/Xcode_[0-9.]##.app(/On[1])
        sudo xcode-select -s "${xcode_path}"
        printf $'DEVELOPER_DIR=%s/Contents/Developer\n' "${xcode_path}" >>"${GITHUB_ENV}"
        Scripts/build codeql -c release

    - name: 🔍 Perform CodeQL analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: /language:${{matrix.language}}
